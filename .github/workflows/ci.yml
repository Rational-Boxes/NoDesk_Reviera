# Linux CI: build, lint and test on Fedora 43 (the development platform).
# macOS CI builds the .app and .dmg (packaging/macos/build-dmg.sh) on main and on demand.
# The Windows job is deferred by owner decision (2026-10-12).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (Fedora 43)
    runs-on: ubuntu-latest
    container: fedora:43
    timeout-minutes: 300
    steps:
      - name: System packages
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar zstd unzip curl gcc gcc-c++ clang clang-devel cmake ninja-build make
          pkgconf-pkg-config perl perl-FindBin perl-IPC-Cmd perl-Time-Piece python3 rustup
          opencascade-devel boost-devel eigen3-devel libxml2-devel json-devel
          gtk3-devel wayland-devel libsecret-devel luajit-devel openxr-devel
          mesa-vulkan-drivers vulkan-loader

      - uses: actions/checkout@v4

      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup-init -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show

      - name: Cache IfcOpenShell
        id: ifcos
        uses: actions/cache@v4
        with:
          path: third_party/install
          key: ifcopenshell-fedora43-${{ hashFiles('tools/build-ifcopenshell.sh') }}

      - name: Build IfcOpenShell
        if: steps.ifcos.outputs.cache-hit != 'true'
        run: IFCOS_JOBS=4 tools/build-ifcopenshell.sh

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  macos:
    name: macOS DMG
    # macOS runners bill at ~10x and this compiles OCCT-linked IfcOpenShell and wxWidgets from
    # source, so keep it off per-PR: run on pushes to main and on manual dispatch. Drop this `if`
    # to exercise every PR too.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - name: Cache IfcOpenShell
        id: ifcos
        uses: actions/cache@v4
        with:
          path: third_party/install
          key: ifcopenshell-macos-${{ hashFiles('tools/build-ifcopenshell.sh') }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          cache-on-failure: true

      - name: Build "BIM Reviera.app" and the DMG
        env:
          # Reuse the cached IfcOpenShell when present; the script rebuilds it otherwise.
          SKIP_IFCOS: ${{ steps.ifcos.outputs.cache-hit == 'true' && '1' || '' }}
        run: packaging/macos/build-dmg.sh

      - name: Upload the DMG
        uses: actions/upload-artifact@v4
        with:
          name: reviera-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  licenses:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
