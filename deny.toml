# SPDX-License-Identifier: GPL-3.0-or-later
# Dependency policy (TECH_STACK §4.2): every dependency must be GPL-3.0 compatible.

[advisories]
version = 2
ignore = [
    # `paste` (unmaintained, no known vulnerability) is a compile-time macro used by wxDragon. A
    # switch to a maintained fork is a candidate upstream patch (TECH_STACK §3.4).
    { id = "RUSTSEC-2024-0436", reason = "compile-time macro dependency of wxDragon; upstream patch candidate" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "BSL-1.0",
    "MPL-2.0", "Unicode-3.0", "CC0-1.0", "Unlicense",
    "LGPL-2.1-or-later", "LGPL-3.0-only", "LGPL-3.0-or-later",
    "GPL-3.0-only", "GPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
# wxDragon fork patches (TECH_STACK §3.4) are added here by URL while they are pending upstream.
unknown-git = "deny"
