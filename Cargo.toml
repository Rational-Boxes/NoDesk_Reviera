# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "3"
members = [
    "apps/reviera",
    "crates/reviera-core",
    "crates/reviera-app",
    "crates/reviera-ifc",
    "crates/reviera-geom",
    "crates/reviera-rxd",
    "crates/reviera-store",
    "crates/reviera-livestore",
    "crates/reviera-net",
    "clients/bimserver/rust",
    "crates/reviera-opencde",
    "crates/reviera-render",
    "crates/reviera-render-wgpu",
    "crates/reviera-godot",
    "crates/reviera-lua",
    "crates/reviera-mcp",
    "crates/reviera-ui",
    "clients/rsp/rust",
    "clients/compute/rust",
    "clients/dstv/rust",
    "clients/precast-cam/rust",
    "crates/reviera-compute",
]
default-members = ["apps/reviera"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Reviera contributors"]
repository = "https://github.com/Rational-Boxes/NoDesk_Reviera"
publish = false

[workspace.dependencies]
# Internal crates
reviera-core = { path = "crates/reviera-core" }
reviera-app = { path = "crates/reviera-app" }
reviera-ifc = { path = "crates/reviera-ifc" }
reviera-geom = { path = "crates/reviera-geom" }
reviera-rxd = { path = "crates/reviera-rxd" }
reviera-store = { path = "crates/reviera-store" }
reviera-livestore = { path = "crates/reviera-livestore" }
reviera-net = { path = "crates/reviera-net" }
reviera-bimserver = { path = "clients/bimserver/rust" }
reviera-opencde = { path = "crates/reviera-opencde" }
reviera-render = { path = "crates/reviera-render" }
reviera-render-wgpu = { path = "crates/reviera-render-wgpu" }
reviera-godot = { path = "crates/reviera-godot" }
reviera-lua = { path = "crates/reviera-lua" }
reviera-mcp = { path = "crates/reviera-mcp" }
reviera-ui = { path = "crates/reviera-ui" }
reviera-rsp = { path = "clients/rsp/rust" }
reviera-dstv = { path = "clients/dstv/rust" }
reviera-precast-cam = { path = "clients/precast-cam/rust" }
reviera-compute-proto = { path = "clients/compute/rust" }
reviera-compute = { path = "crates/reviera-compute" }
# Common
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rayon = "1.12.0"
schemars = { version = "1.2.3", features = ["uuid1"] }
jsonschema = { version = "0.58.6", default-features = false }
earcut = "0.4.11"
i_overlay = "9"
rust_xlsxwriter = { version = "0.99", default-features = false }
imbl = "7.0.2"
pdf-writer = "0.15"
glam = "0.34.1"
zstd = "0.14.2"
sha2 = "0.11.1"
base64 = "0.23.1"
hex = "0.4.3"
tempfile = "3.27.0"
clap = { version = "4.6.7", features = ["derive"] }

# Integrations, adopted crate by crate as each one is implemented
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std"] }
# rustls on ring (no aws-lc: simpler to cross-build), the TLS configuration built by the caller.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
keyring = "4.2.0"
getrandom = "0.4.3"
# SQLCipher with vendored OpenSSL: encryption at rest for the live store (DM-LIVE-016).
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
mlua = { version = "0.12.2", features = ["luajit"] }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
wxdragon = "0.9.22"
wgpu = "30.0.1"
raw-window-handle = "0.6"
pollster = "1.0.1"
bytemuck = "1"
gltf = "1.4.1"
cxx = "1.0.205"
cxx-build = "1.0.205"
cc = "1"
pkg-config = "0.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
# Dependencies (OCCT/IfcOpenShell glue, wgpu) are slow when unoptimised.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
