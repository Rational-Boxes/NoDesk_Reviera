# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "3"
members = [
    "apps/riviera",
    "crates/riviera-core",
    "crates/riviera-app",
    "crates/riviera-ifc",
    "crates/riviera-geom",
    "crates/riviera-rxd",
    "crates/riviera-store",
    "crates/riviera-livestore",
    "crates/riviera-net",
    "clients/bimserver/rust",
    "clients/fileengine/rust",
    "clients/opencde/rust",
    "crates/riviera-render",
    "crates/riviera-render-wgpu",
    "crates/riviera-godot",
    "crates/riviera-lua",
    "crates/riviera-mcp",
    "crates/riviera-ui",
    "clients/rsp/rust",
    "clients/compute/rust",
    "clients/dstv/rust",
    "clients/precast-cam/rust",
    "crates/riviera-compute",
]
default-members = ["apps/riviera"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Riviera contributors"]
repository = "https://github.com/Rational-Boxes/BIM_Riviera"
publish = false

[workspace.dependencies]
# Internal crates
riviera-core = { path = "crates/riviera-core" }
riviera-app = { path = "crates/riviera-app" }
riviera-ifc = { path = "crates/riviera-ifc" }
riviera-geom = { path = "crates/riviera-geom" }
riviera-rxd = { path = "crates/riviera-rxd" }
riviera-store = { path = "crates/riviera-store" }
riviera-livestore = { path = "crates/riviera-livestore" }
riviera-net = { path = "crates/riviera-net" }
riviera-bimserver = { path = "clients/bimserver/rust" }
riviera-fileengine = { path = "clients/fileengine/rust" }
riviera-opencde = { path = "clients/opencde/rust" }
riviera-render = { path = "crates/riviera-render" }
riviera-render-wgpu = { path = "crates/riviera-render-wgpu" }
riviera-godot = { path = "crates/riviera-godot" }
riviera-lua = { path = "crates/riviera-lua" }
riviera-mcp = { path = "crates/riviera-mcp" }
riviera-ui = { path = "crates/riviera-ui" }
riviera-rsp = { path = "clients/rsp/rust" }
riviera-dstv = { path = "clients/dstv/rust" }
riviera-precast-cam = { path = "clients/precast-cam/rust" }
riviera-compute-proto = { path = "clients/compute/rust" }
riviera-compute = { path = "crates/riviera-compute" }
# Common
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rayon = "1.12.0"
schemars = { version = "1.2.3", features = ["uuid1"] }
jsonschema = { version = "0.58.6", default-features = false }
earcut = "0.4.11"
i_overlay = "9"
rust_xlsxwriter = { version = "0.99", default-features = false }
imbl = "7.0.2"
pdf-writer = "0.15"
glam = "0.34.1"
zstd = "0.14.2"
sha2 = "0.11.1"
base64 = "0.23.1"
hex = "0.4.3"
tempfile = "3.27.0"
clap = { version = "4.6.7", features = ["derive"] }

# Integrations, adopted crate by crate as each one is implemented
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std"] }
# rustls on ring (no aws-lc: simpler to cross-build), the TLS configuration built by the caller.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
keyring = "4.2.0"
getrandom = "0.4.3"
# SQLCipher with vendored OpenSSL: encryption at rest for the live store (DM-LIVE-016).
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
mlua = { version = "0.12.2", features = ["luajit"] }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
wxdragon = "0.9.22"
wgpu = "30.0.1"
raw-window-handle = "0.6"
pollster = "1.0.1"
bytemuck = "1"
gltf = "1.4.1"
cxx = "1.0.205"
cxx-build = "1.0.205"
cc = "1"
pkg-config = "0.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
# Dependencies (OCCT/IfcOpenShell glue, wgpu) are slow when unoptimised.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
