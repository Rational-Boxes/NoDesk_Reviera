[package]
name = "riviera-ui"
description = "wxWidgets user interface shell through wxDragon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
glam.workspace = true
png = "0.18"
base64.workspace = true
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
riviera-core.workspace = true
wxdragon = { workspace = true, features = ["aui", "webview"] }
# Direct dependency so its build script (which builds wxWidgets) runs before ours: see build.rs.
wxdragon-sys = "0.9.22"
riviera-app.workspace = true
riviera-store.workspace = true
riviera-lua.workspace = true
riviera-render.workspace = true
riviera-render-wgpu.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit = "0.25"
# The Terminal pane (UI-AGENT-004): pseudo-terminals and the VT emulator.
portable-pty = "0.9"
vt100 = "0.18"
riviera-mcp.workspace = true
tokio.workspace = true
uuid.workspace = true

[build-dependencies]
cc.workspace = true
pkg-config.workspace = true

[lints]
workspace = true
