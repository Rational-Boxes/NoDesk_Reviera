[[action]]
id = "mep.size"
label = "Duct/Pipe Sizing"
icon = "mep_size"
help = "Size the selection's ducts or pipes from their flow: Equal Friction, Friction or Velocity, restrictions and branch rules (MEP-CALC-001)"

[[action]]
id = "mep_network.calculate"
label = "Calculate Networks"
icon = "mep_network"
help = "Calculate pressure drop in every duct and pipe system from its equipment: flows, velocities, friction, fitting losses and the critical path (MEP-CALC-002)"

[[action]]
id = "analytical_segment.list"
label = "Analytical Segments"
icon = "analytical_segments"
help = "A system's analytical segments: flow, velocity, friction, loss, static pressure and the critical path; select them, override a loss, recalculate (MEP-CALC-002)"

[[action]]
id = "system_inspector.start"
label = "System Inspector"
icon = "system_inspector"
help = "Inspect a calculated duct or pipe system in the view: flow arrows, the critical path highlighted, each section's flow, static pressure and loss on hover (MEP-CALC-003)"

[[action]]
id = "system_inspector.properties"
label = "Properties"
icon = "properties"
help = "The inspected system's sections: flow, velocity, loss and static pressure in and out, and the terminals' excess pressure"

[[action]]
id = "system_inspector.stop"
label = "Exit"
icon = "finish"
help = "End the System Inspector"

[[action]]
id = "pressure_loss_report.export"
label = "Pressure Loss Report"
icon = "pressure_report"
help = "Write a duct or pipe system's pressure losses by section, segment and fitting, with its critical path, as CSV or HTML (MEP-CALC-004)"

[[action]]
id = "fixture_unit_method.set"
label = "Fixture-Unit Table"
icon = "fixture_units"
help = "Import your code's fixture-unit table (fixture_units, flow_tank, flow_valve) for domestic water sizing (MEP-PIPE-005)"

[[action]]
id = "circuit.properties"
label = "Circuit Properties"
icon = "circuit_properties"
help = "A circuit's load, current, path length, cable, voltage drop and warnings; its load name, rating, cable type and size (or Auto), runs, path and voltage drop limit (MEP-ELEC-004, 005)"

[[action]]
id = "wiring.settings"
label = "Wiring"
icon = "wiring"
help = "The default cable type, voltage drop limit, correction factor, path offset and your ampacity table (MEP-SET-002, 003)"

[[action]]
id = "panel.set_supply"
label = "Select Supply"
icon = "panel_supply"
help = "Feed the selected panel or transformer from another, on a breaker or feed-through lugs; only sources that would accept it are offered (MEP-ELEC-006)"

[[action]]
id = "panel.hierarchy"
label = "Panel Hierarchy"
icon = "panel_hierarchy"
help = "The distribution tree from the supplies down, with each panel's connected load"

[[action]]
id = "panel_schedule.create"
label = "Panel Schedules"
icon = "schedule"
help = "A live schedule of the selected panel's circuits: slots, load names, trips, loads per phase and the loads summary with demand factors (MEP-ELEC-013)"

[[action]]
id = "panel_schedule.change_panel"
label = "Change Panel"
icon = "panel_settings"
help = "Show another panel in this panel schedule (MEP-ELEC-015)"

[[action]]
id = "load_classification.manage"
label = "Load Classifications"
icon = "load_classes"
help = "The load classifications loads are grouped by in panel schedules, and their demand factors (MEP-ELEC-009)"

[[action]]
id = "demand_factor.manage"
label = "Demand Factors"
icon = "demand_factor"
help = "Constant, by-quantity and by-load demand factors with incremental ranges and the largest-motor rule (MEP-ELEC-010)"

[[action]]
id = "panel.settings"
label = "Panel Settings"
icon = "panel_settings"
help = "A panel's name, distribution system, slots and circuit naming"

[[action]]
id = "mep_check.show_disconnects"
label = "Show Disconnects"
icon = "show_disconnects"
help = "Mark the open connectors of the chosen domains in this view"

