label = "Detach Top"
icon = "column_detach"
help = "Detach the selected columns' tops: they go back to their top constraint"

[[action]]
id = "opening.create_wall"
label = "Wall Opening"
icon = "wall_opening"
help = "Cut a plain rectangular opening through a wall: hover the wall and click (set its width and height in Properties)"

[[action]]
id = "opening.create_vertical"
label = "Vertical"
icon = "vertical_opening"
help = "Sketch an opening cut plumb through a floor, ceiling or roof on this plan's level"

[[action]]
id = "opening.create_shaft"
label = "Shaft"
icon = "shaft"
help = "Sketch a shaft that cuts every floor, ceiling and roof from this level up to the next"

[[action]]
id = "deck.create"
label = "Deck"
icon = "deck"
help = "Sketch a deck's outline in a plan: its boards are laid out one by one over joists, beams and posts"

[[action]]
id = "railing.create"
label = "Railing"
icon = "railing"
help = "Sketch a railing's path in a plan: click its points; click the first to close it, Esc to finish"

[[action]]
id = "railing.create_on_edges"
label = "Guard Edges"
icon = "guard_edges"
help = "Place railings along every open edge of the selected floors, decks or flat roofs"

[[action]]
id = "railing.create_on_stair"
label = "Railings"
icon = "railing"
help = "Put railings on both sides of the selected stairs, following the nosings and landings"

[[action]]
id = "railing.add_opening"
label = "Opening"
icon = "rail_opening"
help = "Add openings to the selected railing: click it where each goes; a post goes each side"

[[action]]
id = "railing.add_gate"
label = "Gate"
icon = "gate"
help = "Add single gates to the selected railing: click it where each goes"

[[action]]
id = "railing.add_double_gate"
label = "Double Gate"
icon = "double_gate"
help = "Add double gates to the selected railing: click it where each goes"

[[action]]
id = "stair.spiral"
label = "Spiral Stair"
icon = "spiral_stair"
help = "Draw a spiral stair in a plan: click its centre, then a point on its walking line"

[[action]]
id = "dormer.create"
label = "Dormer"
icon = "dormer"
help = "Add dormers to the selected roof: gable, hipped, shed or flat, with their walls filling the gaps"

[[action]]
id = "roof.set_eaves"
label = "Eaves"
icon = "eaves"
help = "Make the selected roof's sloped edges eaves that bear on the walls below: overhang from the wall face, fascia and soffit"

[[action]]
id = "roof.attach_walls"
label = "Attach Walls"
icon = "attach"
help = "Attach every wall under the roof to it: gable walls rise to the ridge, the rest meet the roof"

[[action]]
id = "roof.edit_footprint"
label = "Edit Footprint"
icon = "edit_boundary"
help = "Edit the selected roof's footprint, slopes and gables"

[[action]]
id = "wall.attach"
label = "Attach Top/Base"
icon = "attach"
help = "Attach the selected walls' tops to a roof: click the roof next"

[[action]]
id = "wall.detach"
label = "Detach Top/Base"
icon = "detach"
help = "Detach the selected walls; they return to their own tops"

[[action]]
id = "sketch.defines_slope"
label = "Defines Slope"
icon = "slope"
help = "Click footprint curves to switch them between sloping and gable"

[[action]]
id = "sketch.overhang"
label = "Overhang..."
icon = "overhang"
help = "How far the roof reaches past walls picked from now on"

