# ---- Contextual tabs (§1.9): "Modify | <category>" while elements of one category are
# selected: the Modify tab's panels, then the category's own. ----

[[context]]
category = "cat.walls"
label = "Walls"
panels = [{ label = "Wall", tools = [
  { action = "wall.flip", size = "large" },
  { action = "wall.attach", size = "large" },
  { action = "wall.detach", size = "large" },
] }]

[[context]]
category = "cat.doors"
label = "Doors"
panels = [{ label = "Door", tools = [
  { action = "insert.flip_hand", size = "large" },
