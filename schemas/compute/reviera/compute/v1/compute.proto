//
// The remote computation contract (BIM Reviera spec Ch 2 §2.17, DM-RPC-001 … 010).
//
// Reviera is the client; a runner, or a compute host that forwards to its runners, is the
// server. The contract knows only job kinds: each kind brings its own options and result
// messages in its own package (for example reviera.analysis.v1), carried as Any. It changes
// only by adding fields; a breaking change gets a new package (reviera.compute.v2).
//
// Errors are gRPC statuses with a reason code in the `reviera-reason` trailer: invalid_input,
// unsupported_kind, version_mismatch, too_large, limit_exceeded, memory_limit, preempted,
// cancelled, runner_failed, unauthorised, negotiation_failed, host_restarted, not_found,
// subscription_inactive, quota_exceeded (remote analysis subscriptions, subscription.proto).
//
// Calls carry `authorization: Bearer <token>`; on a local socket the token is one-time, passed
// to the server when it is started.

syntax = "proto3";

package reviera.compute.v1;

import "google/protobuf/any.proto";

service Compute {
  // Agrees on compression, hashing and content encryption for the connection.
  rpc Negotiate(NegotiateRequest) returns (NegotiateResponse);
  // What the server offers: job kinds, resources, limits, contract versions.
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  // Ready or not, with load.
  rpc Health(HealthRequest) returns (HealthResponse);

  // Content-addressed inputs: which blobs the server holds, and uploading the rest.
  rpc HasBlobs(HasBlobsRequest) returns (HasBlobsResponse);
  rpc PutBlobs(stream BlobChunk) returns (PutBlobsResponse);

  // Jobs, and the durable job registry (DM-RPC-009).
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc GetJob(GetJobRequest) returns (JobRecord);
  // Numbered events; reconnecting with `after_seq` resumes with none lost or repeated.
  rpc WatchJob(WatchJobRequest) returns (stream JobEvent);
  // The output, resumable from a byte offset.
  rpc GetResults(GetResultsRequest) returns (stream ResultChunk);
  rpc AckResults(AckResultsRequest) returns (AckResultsResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);

  // Asks a local runner or host to exit cleanly.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

// ---- Negotiation ----

// One category of technique ("compression", "hash", "content-encryption"), with the
// identifiers a side accepts in order of preference, from the published registry
// (schemas/compute/registry/techniques.json).
message TechniqueOffer {
  string category = 1;
  repeated string preferred = 2;
}

message NegotiateRequest {
  repeated string contract_versions = 1;  // for example "reviera.compute.v1"
  repeated TechniqueOffer offers = 2;
}

message TechniqueChoice {
  string category = 1;
  string id = 2;
}

message NegotiateResponse {
  string contract_version = 1;
  repeated TechniqueChoice choices = 2;
}

// ---- Description and health ----

message DescribeRequest {}

message KindInfo {
  string kind = 1;                 // for example "analysis.clash"
  uint32 version = 2;
  string runner = 3;               // the runner program's name
  string runner_version = 4;
  string licence = 5;              // SPDX expression of the runner
  repeated string capabilities = 6;
  repeated string accepted_formats = 7;  // media types of inputs
  bool supports_checkpoints = 8;
  bool supports_sessions = 9;
}

message Resources {
  uint32 cores = 1;
  uint64 memory_bytes = 2;
  uint32 gpus = 3;
}

message DescribeResponse {
  repeated string contract_versions = 1;
  repeated KindInfo kinds = 2;
  Resources resources = 3;
  uint64 max_job_bytes = 4;
  string server = 5;               // "reviera-compute-host 0.1.0", or a runner's name
}

message HealthRequest {}

message HealthResponse {
  bool ready = 1;
  uint32 jobs_running = 2;
  uint32 jobs_queued = 3;
  uint64 memory_bytes = 4;
}

// ---- Blobs ----

message BlobRef {
  string sha256 = 1;               // of the uncompressed content, lower-case hex
  string media_type = 2;           // for example "application/x-protobuf"
  string schema = 3;               // for example "reviera.analysis.v1.MeshSet"
  uint64 size = 4;                 // uncompressed bytes
}

message HasBlobsRequest {
  repeated string sha256 = 1;
}

message HasBlobsResponse {
  repeated string present = 1;
}

// A piece of one blob, encoded with a negotiated codec. A blob's chunks arrive in order;
// `last` closes it, and the server decodes it and checks the hash.
message BlobChunk {
  BlobRef blob = 1;                // on the first chunk of each blob
  string sha256 = 2;               // on every chunk
  string codec = 3;                // on the first chunk
  uint64 offset = 4;               // into the encoded bytes
  bytes data = 5;
  bool last = 6;
}

message PutBlobsResponse {
  repeated string stored = 1;
}

// ---- Jobs ----

message Distillation {
  string distiller = 1;            // for example "clash.bodies"
  uint32 distiller_version = 2;
  string detail = 3;               // "coarse" | "medium" | "fine"
  bool anonymised = 4;
}

message SubmitJobRequest {
  string client_job_key = 1;       // idempotency: the same key returns the existing job
  string kind = 2;
  uint32 kind_version = 3;
  google.protobuf.Any options = 4;
  repeated BlobRef inputs = 5;
  Distillation distillation = 6;
  string snapshot_hash = 7;
  string project = 8;
}

message SubmitJobResponse {
  string job_id = 1;
  bool existing = 2;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_QUEUED = 1;
  JOB_STATE_STARTING = 2;
  JOB_STATE_RUNNING = 3;
  JOB_STATE_SUCCEEDED = 4;
  JOB_STATE_FAILED = 5;
  JOB_STATE_CANCELLED = 6;
}

message Failure {
  string reason = 1;               // a reason code (see the header)
  string message = 2;
  string runner_output = 3;        // the runner's last output, for runner failures
}

message JobRecord {
  string job_id = 1;
  string client_job_key = 2;
  string kind = 3;
  uint32 kind_version = 4;
  JobState state = 5;
  float progress = 6;              // 0 … 1
  string phase = 7;
  int64 submitted_ms = 8;          // Unix time, milliseconds
  int64 started_ms = 9;
  int64 finished_ms = 10;
  string host = 11;
  uint64 last_seq = 12;
  string result_sha256 = 13;
  uint64 result_size = 14;
  int64 expires_ms = 15;
  Failure failure = 16;
  string project = 17;
  bool acknowledged = 18;
}

message ListJobsRequest {
  repeated JobState states = 1;    // empty: all
  string kind = 2;
  string project = 3;
  uint32 page_size = 4;
  string page_token = 5;
}

message ListJobsResponse {
  repeated JobRecord jobs = 1;
  string next_page_token = 2;
}

message GetJobRequest {
  string job_id = 1;
}

message WatchJobRequest {
  string job_id = 1;
  uint64 after_seq = 2;            // 0: from the start
}

message JobEvent {
  uint64 seq = 1;
  int64 time_ms = 2;
  oneof event {
    Progress progress = 3;
    LogLine log = 4;
    string warning = 5;
    Heartbeat heartbeat = 6;
    Checkpoint checkpoint = 7;
    StateChange state = 8;
  }
}

message Progress {
  float fraction = 1;
  string phase = 2;
}

message LogLine {
  string level = 1;
  string line = 2;
}

message Heartbeat {}

message Checkpoint {
  string id = 1;
}

message StateChange {
  JobState state = 1;
  Failure failure = 2;
}

// Provenance of a result (DM-RPC-001).
message ResultManifest {
  string kind = 1;
  uint32 kind_version = 2;
  string runner = 3;
  string runner_version = 4;
  Distillation distillation = 5;
  string snapshot_hash = 6;
  repeated string inputs = 7;      // input blob hashes
  string host = 8;
  int64 started_ms = 9;
  int64 finished_ms = 10;
  string media_type = 11;
  string schema = 12;              // for example "reviera.analysis.v1.ClashResult"
  string codec = 13;               // how the output bytes are encoded
  string sha256 = 14;              // of the decoded output
  uint64 size = 15;                // decoded bytes
}

message GetResultsRequest {
  string job_id = 1;
  uint64 offset = 2;               // into the encoded output, to resume a download
}

message ResultChunk {
  ResultManifest manifest = 1;     // on the first chunk
  uint64 offset = 2;
  uint64 total = 3;                // encoded bytes
  bytes data = 4;
  bool last = 5;
}

message AckResultsRequest {
  string job_id = 1;
}

message AckResultsResponse {}

message CancelJobRequest {
  string job_id = 1;
}

message CancelJobResponse {
  JobState state = 1;
}

message ShutdownRequest {}

message ShutdownResponse {}
