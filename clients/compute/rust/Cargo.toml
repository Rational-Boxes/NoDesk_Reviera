[package]
name = "reviera-compute-proto"
description = "Reviera remote computation contract: generated gRPC types, negotiation, blob codecs and a runner toolkit (spec Ch 2 §2.17)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
prost = "0.14.4"
prost-types = "0.14.4"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tokio = { workspace = true, features = ["net", "fs"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tower = "0.5.3"
hyper-util = { version = "0.1.21", features = ["tokio"] }
getrandom = "0.3.4"
sha2.workspace = true
hex.workspace = true
zstd.workspace = true
# The `subscription` feature: the HTTPS client for remote analysis services (DM-RPC-011).
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { version = "0.6", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[features]
subscription = ["dep:reqwest", "dep:rustls", "dep:rustls-platform-verifier", "dep:serde", "dep:serde_json", "dep:base64"]

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = "0.14.6"

[lints]
workspace = true

[[test]]
name = "subscription"
required-features = ["subscription"]
